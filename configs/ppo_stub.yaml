# MaskablePPO vs. the Random agent on the toy-mode stub env (M0).
# python -m micromagic.training.train_ppo --config configs/ppo_stub.yaml
seed: 0
total_timesteps: 200000
n_envs: 8
opponent: random
out_dir: runs/ppo
ppo:
  learning_rate: 3.0e-4
  n_steps: 256          # per env, so 2048 transitions per update
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [256, 256]
eval:
  opponent: random
  games: 500
  seed: 100000          # fixed eval game seeds: games use 100000, 100001, ...
