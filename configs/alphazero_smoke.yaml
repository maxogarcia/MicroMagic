# AlphaZero-lite smoke run: a few small iterations to check the loop end to end (~1-2 min).
# python -m micromagic.training.train_alphazero --config configs/alphazero_smoke.yaml
seed: 0
total_timesteps: 3000          # real env steps (search simulations are counted separately)
games_per_iteration: 8
workers: 4
out_dir: runs/alphazero
net:
  hidden: [128, 128]
search:
  determinizations: 1
  simulations: 16
  c_puct: 1.5
selfplay:
  temperature_moves: 10
  dirichlet_alpha: 0.3
buffer_size: 20000
min_buffer: 64
batch_size: 64
train_steps: 50
optim:
  lr: 1.0e-3
  weight_decay: 1.0e-4
curve:
  every_iterations: 2
  games: 8
  seed: 200000
  opponents: [random]
  policy_only: true
eval:
  opponents: [random]
  games: 8
  seed: 100000
  policy_only: true
