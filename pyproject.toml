[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micromagic"
version = "0.1.0"
description = "MicroMagic: Reinforcement learning experimentation framework for simplified Magic: The Gathering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "gymnasium>=0.29",
    "pettingzoo>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
rl = [
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micromagic = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
